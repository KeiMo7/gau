threads = 2
verbose = false
retries = 15
subdomains = false
parameters = false
providers = ["wayback","commoncrawl","otx","urlscan"]
blacklist = ["ttf","woff","svg","png","jpg"]
json = false
# URL provenance (source tracking) — off by default; see README "URL provenance".
# Config-file spellings differ from the CLI flags (no hyphens):
#   withsources = false
#   provstate = ""            # default "$HOME/.gau-prov-state.json", "none" disables
#   provfaillimit = 3

[urlscan]
  apikey = ""

[filters]
  from = ""
  to = ""
  matchstatuscodes = []
  matchmimetypes = []
  filterstatuscodes = []
  filtermimetypes = ["image/png", "image/jpg", "image/svg+xml"]
